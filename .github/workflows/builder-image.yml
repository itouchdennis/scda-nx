# Builds the scda-nx builder image (docker/Dockerfile) and publishes it as ghcr.io/<owner>/scda-nx-builder. The image
# holds the toolchain, the Vulkan driver and this repository's sources only: no game data and no code made from the
# game ever passes through here. The game is added by each user, on their own computer (build-nro-docker.sh).
name: builder image

on:
  push:
    branches: [main]
    paths:
      - docker/**
      - switch/**
      - cmake/**
      - config/**
      - src/**
      - tools/**
      - CMakeLists.txt
      - .dockerignore
      - .github/workflows/builder-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # the image needs more room than the runner leaves: drop toolchains it will not use
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/scda-nx-builder" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
